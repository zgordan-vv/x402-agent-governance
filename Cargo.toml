[workspace]
resolver = "2"
members = [
  "crates/governance-core",
  "crates/governance-api",
  "crates/governance-storage",
  "crates/governance-worker",
  "crates/governance-sdk-rust",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
uuid = { version = "1", features = ["serde", "v7"] }

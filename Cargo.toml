[workspace]
resolver = "2"
members = [
  "crates/governance-core",
  "crates/governance-api",
  "crates/governance-storage",
  "crates/governance-worker",
  "crates/governance-sdk-rust",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
url = "2"
uuid = { version = "1", features = ["serde", "v7"] }

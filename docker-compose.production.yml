services:
  postgres:
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_BIND_PORT:-5434}:5432"
  api:
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_BIND_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
  worker:
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
  sandbox:
    profiles: [sandbox]

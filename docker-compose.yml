services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-governance}
      POSTGRES_USER: ${POSTGRES_USER:-governance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_BIND_PORT:-5433}:5432"
    volumes:
      - governance-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-governance}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-governance}
      DECISION_KEY_ID: ${DECISION_KEY_ID:?Set DECISION_KEY_ID in .env}
      DECISION_SIGNING_KEY_B64: ${DECISION_SIGNING_KEY_B64:?Set DECISION_SIGNING_KEY_B64 in .env}
      DECISION_OLD_PUBLIC_KEYS_JSON: ${DECISION_OLD_PUBLIC_KEYS_JSON:-{}}
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_BIND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-governance}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-governance}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-5}
      DB_ACQUIRE_TIMEOUT_MS: ${DB_ACQUIRE_TIMEOUT_MS:-5000}
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    image: node:20-alpine
    working_dir: /workspace
    command: ["sh", "-c", "node -e \"console.log('dashboard bootstrap-ready')\""]
    volumes:
      - .:/workspace:ro

  sandbox:
    image: node:20-alpine
    working_dir: /workspace/apps/sandbox
    command: ["node", "src/server.mjs"]
    ports:
      - "8090:8090"
    environment:
      PORT: 8090
    volumes:
      - .:/workspace:ro

volumes:
  governance-postgres:
